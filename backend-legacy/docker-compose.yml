version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ppallae
      POSTGRES_USER: ppallae
      POSTGRES_PASSWORD: ppallae
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init_postgis.sql:/docker-entrypoint-initdb.d/init_postgis.sql:ro

  api:
    build:
      context: .
    env_file:
      - .env.example
    depends_on:
      - db
    ports:
      - "8081:8081"

volumes:
  pg_data:

